# Essai local « comme en production » : l'application et une base Postgres.
#   docker compose up --build        puis http://localhost:8501
services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgres://gevaudan:gevaudan@base:5432/gevaudan
      FUSEAU: Europe/Paris
    depends_on:
      base:
        condition: service_healthy
  base:
    image: postgres:16
    environment:
      POSTGRES_USER: gevaudan
      POSTGRES_PASSWORD: gevaudan
      POSTGRES_DB: gevaudan
    volumes:
      - donnees:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gevaudan"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  donnees:
