name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      # Une vraie base Postgres : tests/test_stockage.py y rejoue les mêmes scénarios que sur SQLite.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked  # échoue si uv.lock n'est plus d'accord avec pyproject.toml
      - run: uv run ruff check
      - run: uv run pytest -v

  image:
    # L'image de production se construit et répond au point de santé.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gevaudan .
      - run: docker run -d --name gevaudan -p 8501:8501 gevaudan
      - run: curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8501/_stcore/health
      - if: failure()
        run: docker logs gevaudan

  journal:
    # Mémoire du projet : une PR qui touche au code doit ajouter une entrée à CHANGELOG.md.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'sans-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python outils/verifier_changelog.py "origin/${{ github.base_ref }}"
