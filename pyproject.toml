[project]
name = "projet-gevaudan"
version = "0.1.0"
description = "Loup-Garou grandeur nature en hotseat, mené par une application Streamlit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.58,<2",
    "sqlalchemy>=2,<3",       # stockage SQL (hébergement) : SQLite ou Postgres, mêmes requêtes
    "psycopg[binary]>=3.2",   # pilote Postgres (DATABASE_URL=postgres://...)
    "tzdata",                 # fuseaux horaires sur les images minimales (Docker)
]

[dependency-groups]
# Tests et qualité (installés par défaut avec `uv sync`).
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
# Test de bout en bout dans un navigateur (tests_e2e/) : `uv sync --group e2e`, puis `uv run playwright install chromium`
# (ou, en local, E2E_CHANNEL=chrome pour utiliser le Chrome installé sans rien télécharger).
e2e = [
    "playwright>=1.49",
]
# Générateurs d'assets et simulation d'équilibre (outils/), à la demande : `uv sync --group outils`.
outils = [
    "numpy",
    "lameenc",
    "cairosvg",
]

[tool.uv]
package = false  # application, pas une bibliothèque : rien à installer, seules les dépendances comptent

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
# Erreurs de syntaxe et pyflakes (imports inutilisés, noms indéfinis) : le minimum qui attrape de vrais bugs.
select = ["E9", "F"]
